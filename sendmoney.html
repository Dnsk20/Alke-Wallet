<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wallet - Enviar Dinero</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet"
        href="assets/css/styles.css">
</head>

<body>

    <main class="container mt-5">

        <div class="card shadow">

            <!-- Encabezado -->
            <div class="card-header bg-primary text-white text-center">

                <h2 class="mb-0">
                    Enviar Dinero
                </h2>

            </div>

            <div class="card-body">

                <!-- Mensajes -->
                <div id="mensaje"></div>


                <!-- Buscar contacto -->
                <div class="form-group">

                    <label for="searchContact">
                        Buscar en la agenda de transferencias:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="searchContact"
                        placeholder="Buscar por nombre o alias">

                </div>


                <!-- Agregar contacto -->
                <button
                    type="button"
                    id="btnAgregarContacto"
                    class="btn btn-primary btn-block">

                    Agregar nuevo contacto

                </button>


                <!-- Lista de contactos -->
                <h3 class="mt-4 mb-3">
                    Contactos
                </h3>

                <ul
                    id="contactList"
                    class="list-group mb-4">
                </ul>


                <!-- Monto -->
                <div class="form-group">

                    <label for="sendAmount">
                        Monto a enviar:
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="sendAmount"
                        placeholder="Ingrese el monto"
                        min="1"
                        step="0.01">

                </div>


                <!-- Botón enviar -->
                <!-- Comienza oculto -->
                <button
                    type="button"
                    id="btnEnviar"
                    class="btn btn-success btn-block"
                    style="display: none;">

                    Enviar dinero

                </button>


                <!-- Volver al menú -->
                <a
                    href="menu.html"
                    class="btn btn-secondary btn-block mt-3">

                    Volver al Menú Principal

                </a>

            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- MODAL AGREGAR CONTACTO -->
    <!-- ========================================= -->

    <div
        class="modal fade"
        id="contactModal"
        tabindex="-1"
        role="dialog"
        aria-hidden="true">

        <div
            class="modal-dialog"
            role="document">

            <div class="modal-content">


                <!-- Cabecera del modal -->
                <div class="modal-header">

                    <h5 class="modal-title">
                        Agregar nuevo contacto
                    </h5>

                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Cerrar">

                        <span>
                            &times;
                        </span>

                    </button>

                </div>


                <!-- Contenido del modal -->
                <div class="modal-body">

                    <form id="contactForm">


                        <!-- Nombre -->
                        <div class="form-group">

                            <label for="contactName">
                                Nombre y apellido:
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactName"
                                required>

                        </div>


                        <!-- CBU -->
                        <div class="form-group">

                            <label for="contactCbu">
                                Número de CBU:
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactCbu"
                                required>

                        </div>


                        <!-- Alias -->
                        <div class="form-group">

                            <label for="contactAlias">
                                Alias:
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactAlias"
                                required>

                        </div>


                        <!-- Banco -->
                        <div class="form-group">

                            <label for="contactBank">
                                Nombre del Banco:
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactBank"
                                required>

                        </div>


                        <!-- Guardar contacto -->
                        <button
                            type="submit"
                            class="btn btn-primary btn-block">

                            Guardar contacto

                        </button>


                        <!-- Cancelar -->
                        <button
                            type="button"
                            class="btn btn-secondary btn-block"
                            data-dismiss="modal">

                            Cancelar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- jQuery -->
    <!-- ========================================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- ========================================= -->
    <!-- Popper -->
    <!-- ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js">
    </script>


    <!-- ========================================= -->
    <!-- Bootstrap -->
    <!-- ========================================= -->

    <script
        src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js">
    </script>


    <!-- ========================================= -->
    <!-- JavaScript principal -->
    <!-- ========================================= -->

    <script
        src="assets/js/script.js">
    </script>

</body>

</html>
