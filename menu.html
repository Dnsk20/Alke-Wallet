<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wallet - Menú Principal</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <main class="container mt-5">

        <nav aria-label="Navegación principal">

        <div class="card shadow">

            <!-- Encabezado -->
            <div class="card-header bg-primary text-white text-center">

                <h2 class="mb-0">
                    Menú Principal
                </h2>

            </div>

            <div class="card-body text-center">

                <!-- Saldo -->
                <div class="alert alert-success">

                    <strong>
                        Dinero en cuenta:
                    </strong>

                    <h3 class="mb-0">
                        $200000.00
                    </h3>

                </div>


                <!-- Botón Depositar -->
                <button type="button" id="btnDepositar" class="btn btn-primary btn-block">

                    Depositar

                </button>


                <!-- Botón Enviar Dinero -->
                <button type="button" id="btnEnviarDinero" class="btn btn-primary btn-block">

                    Enviar Dinero

                </button>


                <!-- Botón Retirar Dinero -->
                <button type="button" id="btnRetirar" class="btn btn-primary btn-block">

                    Retirar Dinero

                </button>


                <!-- Botón Recibir Dinero -->
                <button type="button" id="btnRecibir" class="btn btn-primary btn-block">

                    Recibir Dinero

                </button>


                <!-- Botón Últimos Movimientos -->
                <button type="button" id="btnMovimientos" class="btn btn-primary btn-block">

                    Últimos Movimientos

                </button>


                <!-- Mensaje de redirección -->
                <div id="menu-message" class="mt-3">
                </div>


                <!-- Cerrar sesión -->
                <button type="button" id="btnCerrarSesion" class="btn btn-secondary btn-block mt-3">

                    Cerrar sesión

                </button>

            </div>

        </div>

        </nav>

    </main>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <!-- Bootstrap -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>


    <!-- JavaScript principal -->
    <script src="assets/js/script.js"></script>

</body>

</html>
